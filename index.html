<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Duels2D — A modular 2D physics-based bouncing battle simulator powered by Matter.js." />
  <title>Duels2D — Bouncing Battle Simulator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Command Line UI -->
  <div id="command-line" class="hidden">
    <div class="command-prompt">&gt;</div>
    <input type="text" id="command-input" autocomplete="off" spellcheck="false" />
    <div id="command-status"></div>
  </div>

  <aside id="character-select-panel" class="character-select-panel hidden" aria-label="Character selection">
    <div class="character-select-header">
      <div>
        <div class="character-select-kicker">Roster</div>
        <h2>Character Select</h2>
      </div>
      <button type="button" id="character-select-close" aria-label="Close character selection">x</button>
    </div>

    <input
      type="search"
      id="character-select-search"
      class="character-select-search"
      placeholder="Search characters"
      autocomplete="off"
      spellcheck="false"
    />

    <div id="character-select-grid" class="character-select-grid"></div>

    <div class="character-select-help">Click cards to assign P1, then P2. Two selected characters restart the fight.</div>
  </aside>


  <!-- Game Header (Title and status display on top of/above the arena) -->
  <div id="game-header">
    <h1 id="hud-title">DUELS <span class="accent">2D</span></h1>
    <div id="hud-status">FIGHT!</div>
  </div>

  <!-- PLAN 1: 9:16 game container centres and constrains the canvas -->
  <div id="game-container">

    <!-- ARENA CANVAS — JS sizes it to the container, not the full window -->
    <canvas id="arena-canvas"></canvas>


  </div><!-- /#game-container -->

  <!-- Game Footer (Like & Subscribe text on the bottom of the arena) -->
  <div id="game-footer">
    Like & Subscribe
  </div>

  <!-- MATTER.JS CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <!--
    PLAN 3: Howler.js CDN for non-clipping, channel-managed audio.
    Howler handles AudioContext unlock, sprite sheets, and concurrent playback.
    Swap this for a local copy if you prefer:
      <script src="assets/vendor/howler.min.js"></script>
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

  <!-- CONFIGS -->
  <script src="config/game-settings.js"></script>
  <script src="config/indicator-settings.js"></script>
  <script src="config/sound-manifest.js"></script>
  <script src="config/fighter-loader.js"></script>
  <script src="config/fighter-config.js"></script>

  <!-- GAME SCRIPTS -->
  <script src="src/entities/fighter.js"></script>
  <script src="src/entities/projectile.js"></script>
  <script src="src/ui/fighter-select-panel.js"></script>
  <script src="src/systems/indicator-system.js"></script>
  <script src="src/systems/weapon-system.js"></script>
  <script src="src/engine/game-manager.js"></script>
  <script src="src/boot/start-game.js"></script>
  <script src="src/ui/command-console.js"></script>

</body>
</html>
