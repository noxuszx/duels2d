<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Duels2D — A modular 2D physics-based bouncing battle simulator powered by Matter.js." />
  <title>Duels2D — Bouncing Battle Simulator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Command Line UI -->
  <div id="command-line" class="hidden">
    <div class="command-input-shell">
      <div class="command-prompt">&gt;</div>
      <input type="text" id="command-input" autocomplete="off" spellcheck="false" aria-label="Command" placeholder="Type a command…" />
    </div>
    <div id="command-status"></div>
    <div class="command-hint"><kbd>Enter</kbd> Run <kbd>Esc</kbd> Close</div>
  </div>

  <aside id="character-select-panel" class="character-select-panel hidden" aria-label="Character selection">
    <div class="character-select-header">
      <div class="character-select-identity">
        <div>
          <div class="character-select-kicker">Duels2D / Match Setup</div>
          <h2>Character Select</h2>
        </div>
      </div>
      <button type="button" id="character-select-close" aria-label="Close character selection">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="character-select-toolbar">
      <label class="character-search-shell" for="character-select-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input type="search" id="character-select-search" class="character-select-search" placeholder="Search roster" autocomplete="off" spellcheck="false" />
      </label>
      <span id="character-result-count" class="character-result-count"></span>
    </div>

    <div class="character-select-workspace">
      <div class="roster-panel-heading"><span>Roster</span><span>Click to assign</span></div>
      <div id="character-select-grid" class="character-select-grid"></div>
    </div>

  </aside>


  <!-- Game Header (Title and status display on top of/above the arena) -->
  <div id="game-header">
    <h1 id="hud-title">DUELS <span class="accent">2D</span></h1>
    <div id="hud-status">FIGHT!</div>
  </div>

  <!-- Square game container centres and constrains the canvas -->
  <div id="game-container">

    <!-- ARENA CANVAS — JS sizes it to the container, not the full window -->
    <canvas id="arena-canvas"></canvas>


  </div><!-- /#game-container -->

  <!-- Game Footer (Like & Subscribe text on the bottom of the arena) -->
  <div id="game-footer">
    Like & Subscribe
  </div>

  <div id="transport-controls" role="group" aria-label="Playback controls">
    <button type="button" id="transport-play" class="transport-button" title="Play" aria-label="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z" /></svg>
    </button>
    <button type="button" id="transport-pause" class="transport-button" title="Pause" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" /></svg>
    </button>
    <button type="button" id="transport-restart" class="transport-button" title="Restart" aria-label="Restart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4" /><path d="M5.5 6.5A8 8 0 1 1 4 14" /></svg>
    </button>
    <button type="button" id="transport-record" class="transport-button" title="Record a new match" aria-label="Record a new match" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6" /></svg>
    </button>
  </div>

  <script type="module" src="/src/boot/start-game.ts"></script>

</body>
</html>
