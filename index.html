<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Duels2D — A modular 2D physics-based bouncing battle simulator powered by Matter.js." />
  <title>Duels2D — Bouncing Battle Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Game Header (Title and status display on top of/above the arena) -->
  <div id="game-header">
    <h1 id="hud-title">DUELS <span class="accent">2D</span></h1>
    <div id="hud-status">FIGHT!</div>
  </div>

  <!-- PLAN 1: 9:16 game container centres and constrains the canvas -->
  <div id="game-container">

    <!-- ARENA CANVAS — JS sizes it to the container, not the full window -->
    <canvas id="arena-canvas"></canvas>

    <!-- WINNER SCREEN -->
    <div id="winner-screen" class="hidden">
      <div id="winner-box">
        <div id="winner-label">WINNER</div>
        <div id="winner-name">—</div>
        <button id="restart-btn">&#x27F3; REMATCH</button>
      </div>
    </div>

  </div><!-- /#game-container -->

  <!-- Game Footer (Like & Subscribe text on the bottom of the arena) -->
  <div id="game-footer">
    Like & Subscribe
  </div>

  <!-- MATTER.JS CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <!--
    PLAN 3: Howler.js CDN for non-clipping, channel-managed audio.
    Howler handles AudioContext unlock, sprite sheets, and concurrent playback.
    Swap this for a local copy if you prefer:
      <script src="assets/vendor/howler.min.js"></script>
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

  <!-- CONFIGS -->
  <script src="config/game.js"></script>
  <script src="config/characters.js"></script>

  <!-- GAME SCRIPT -->
  <script src="game.js"></script>

</body>
</html>
